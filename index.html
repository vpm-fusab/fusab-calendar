<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FUSAB Events</title>

  <style>
    @font-face {
      font-family: "FUSAB Matula";
      src: url("./BFMatulaW00-BlackItalic.woff2") format("woff2");
      font-style: italic;
      font-weight: 900;
      font-display: swap;
    }

    @font-face {
      font-family: "FUSAB Bodoni";
      src: url("./BodoniSvtyTwoITCTT-Book.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: "FUSAB Bodoni";
      src: url("./BodoniSvtyTwoITCTT-Bold.woff2") format("woff2");
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }

    @font-face {
      font-family: "FUSAB Bodoni";
      src: url("./BodoniSvtyTwoITCTT-BookIta.woff2") format("woff2");
      font-style: italic;
      font-weight: 400;
      font-display: swap;
    }

    :root {
      --bg: #F5F5F5;
      --text: #000000;
      --blue: #192F93;
      --muted: #3D3D3D;
      --line: rgba(0, 0, 0, .14);
      --max: 1100px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
    }

    body {
      padding: 32px 22px 52px;
      font-family: "FUSAB Bodoni", "Bodoni 72", Didot, serif;
      font-size: 18px;
    }

    .wrap {
      width: 100%;
      max-width: var(--max);
      margin: 0 auto;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 30px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 8px;
      font-family: "FUSAB Matula", serif;
      font-size: 16px;
      font-style: italic;
      font-weight: 900;
      color: var(--blue);
    }

    h1 {
      margin: 0;
      font-family: "FUSAB Matula", serif;
      font-size: clamp(48px, 7vw, 82px);
      font-style: italic;
      font-weight: 900;
      color: var(--blue);
      line-height: .88;
      letter-spacing: -.045em;
    }

    .subscribe-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .subscribe {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 18px;
      border: 1px solid var(--blue);
      border-radius: 999px;
      color: var(--blue);
      background: transparent;
      text-decoration: none;
      font-family: "FUSAB Bodoni", serif;
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      transition:
        background .2s ease,
        color .2s ease,
        transform .2s ease;
    }

    .subscribe:hover,
    .subscribe:focus-visible {
      background: var(--blue);
      color: var(--bg);
      transform: translateY(-1px);
      outline: none;
    }

    .subscribe-note {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-style: italic;
      text-align: right;
    }

    #status {
      padding: 32px 0;
      color: var(--muted);
      font-size: 17px;
    }

    .month {
      margin-top: 46px;
    }

    .month-title {
      margin: 0;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      font-family: "FUSAB Matula", serif;
      font-size: 27px;
      font-style: italic;
      font-weight: 900;
      color: var(--blue);
      line-height: 1;
    }

    .event {
      display: grid;
      grid-template-columns: 90px minmax(0, 1fr) auto;
      gap: 28px;
      padding: 30px 0;
      border-bottom: 1px solid var(--line);
      align-items: start;
    }

    .date {
      display: flex;
      flex-direction: column;
    }

    .day {
      font-family: "FUSAB Bodoni", serif;
      font-size: 46px;
      font-weight: 700;
      color: var(--text);
      line-height: .92;
      letter-spacing: -.035em;
    }

    .weekday {
      margin-top: 8px;
      color: var(--muted);
      font-family: "FUSAB Bodoni", serif;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .event h2 {
      margin: 0 0 10px;
      font-family: "FUSAB Matula", serif;
      font-size: clamp(28px, 3.5vw, 42px);
      font-style: italic;
      font-weight: 900;
      color: var(--blue);
      line-height: .95;
      letter-spacing: -.02em;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 18px;
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
    }

    .description {
      max-width: 720px;
      margin: 16px 0 0;
      color: var(--text);
      font-size: 18px;
      line-height: 1.58;
      white-space: pre-line;
    }

    .add {
      align-self: center;
      display: inline-flex;
      align-items: center;
      padding: 10px 15px;
      border: 1px solid var(--blue);
      border-radius: 999px;
      color: var(--blue);
      background: transparent;
      text-decoration: none;
      font-family: "FUSAB Bodoni", serif;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      transition:
        background .2s ease,
        color .2s ease,
        transform .2s ease;
    }

    .add:hover,
    .add:focus-visible {
      background: var(--blue);
      color: var(--bg);
      transform: translateY(-1px);
      outline: none;
    }

    .empty {
      padding: 60px 0;
      color: var(--muted);
      font-size: 20px;
    }

    /* NORMAL RESPONSIVE MODE */

    @media (max-width: 900px) {
      body {
        padding: 24px 18px 40px;
      }

      .top {
        flex-direction: column;
        align-items: flex-start;
        gap: 22px;
      }

      .subscribe-wrap {
        align-items: flex-start;
      }

      .subscribe-note {
        text-align: left;
      }

      h1 {
        font-size: clamp(46px, 10vw, 72px);
        max-width: 650px;
      }

      .event {
        grid-template-columns: 70px minmax(0, 1fr);
        gap: 20px;
      }

      .add {
        grid-column: 2;
        justify-self: start;
        margin-top: 4px;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 14px 36px;
      }

      .eyebrow {
        font-size: 14px;
      }

      h1 {
        font-size: clamp(42px, 13vw, 64px);
        line-height: .9;
      }

      .subscribe {
        width: 100%;
        justify-content: center;
      }

      .month {
        margin-top: 36px;
      }

      .month-title {
        font-size: 23px;
      }

      .event {
        grid-template-columns: 55px minmax(0, 1fr);
        gap: 16px;
        padding: 24px 0;
      }

      .day {
        font-size: 34px;
      }

      .weekday {
        font-size: 12px;
      }

      .event h2 {
        font-size: clamp(27px, 8vw, 38px);
      }

      .meta {
        font-size: 15px;
      }

      .description {
        font-size: 17px;
      }

      .add {
        grid-column: 1 / -1;
        justify-self: stretch;
        justify-content: center;
        margin-top: 4px;
      }
    }

    /* =========================================
       SQUARESPACE EMBED MODE
       Triggered with ?embed=1
       ========================================= */

    body.embed-mode {
      padding: 0 14px 40px;
    }

    body.embed-mode .top {
      display: none;
    }

    body.embed-mode #status {
      padding-top: 10px;
    }

    body.embed-mode .month {
      margin-top: 28px;
    }

    body.embed-mode #events > .month:first-child {
      margin-top: 0;
    }

    body.embed-mode .month-title {
      font-family: "FUSAB Matula", serif;
      color: var(--blue);
      font-size: 25px;
      line-height: 1;
      padding-bottom: 13px;
    }

    body.embed-mode .event {
      grid-template-columns: 54px minmax(0, 1fr);
      gap: 16px;
      padding: 24px 0;
    }

    body.embed-mode .day {
      font-size: 37px;
      line-height: .9;
    }

    body.embed-mode .weekday {
      font-size: 12px;
      margin-top: 7px;
    }

    body.embed-mode .event h2 {
      font-family: "FUSAB Matula", serif;
      color: var(--blue);
      font-size: clamp(25px, 5vw, 34px);
      line-height: .95;
      margin-bottom: 8px;
    }

    body.embed-mode .meta {
      font-family: "FUSAB Bodoni", serif;
      font-size: 15px;
      line-height: 1.4;
    }

    body.embed-mode .description {
      font-family: "FUSAB Bodoni", serif;
      font-size: 16px;
      line-height: 1.5;
      margin-top: 12px;
    }

    body.embed-mode .add {
      grid-column: 2;
      justify-self: start;
      margin-top: 2px;
      padding: 9px 14px;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      body.embed-mode {
        padding: 0 10px 32px;
      }

      body.embed-mode .month-title {
        font-size: 22px;
      }

      body.embed-mode .event {
        grid-template-columns: 48px minmax(0, 1fr);
        gap: 13px;
        padding: 21px 0;
      }

      body.embed-mode .day {
        font-size: 32px;
      }

      body.embed-mode .event h2 {
        font-size: 26px;
      }

      body.embed-mode .meta {
        font-size: 14px;
      }

      body.embed-mode .description {
        font-size: 15px;
      }

      body.embed-mode .add {
        grid-column: 1 / -1;
        justify-self: stretch;
        justify-content: center;
      }
    }
  </style>
</head>

<body>

  <script>
    if (
      new URLSearchParams(window.location.search).get("embed") === "1"
    ) {
      document.body.classList.add("embed-mode");
    }
  </script>

  <main class="wrap">

    <header class="top">

      <div>
        <p class="eyebrow">FUSAB CALENDAR</p>
        <h1>Upcoming Events</h1>
      </div>

      <div class="subscribe-wrap">

        <a
          class="subscribe"
          href="webcal://calendar.google.com/calendar/ical/vppr.fusab%40gmail.com/public/basic.ics"
          aria-label="Subscribe to the FUSAB calendar"
        >
          Subscribe to Calendar ↗
        </a>

        <p class="subscribe-note">
          Stays synced when events change.
        </p>

      </div>

    </header>

    <div
      id="status"
      role="status"
      aria-live="polite"
    >
      Loading events…
    </div>

    <div id="events"></div>

  </main>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbxeE1suq4_9ieJXljWhlZ3P-0i6OaISIRG7LCsiTbcX-qaEHX7rgR6LdAcIAE3ayVXgNA/exec";

    const eventsContainer =
      document.getElementById("events");

    const status =
      document.getElementById("status");


    function formatMonth(date) {
      return new Intl.DateTimeFormat(
        undefined,
        {
          month: "long",
          year: "numeric"
        }
      ).format(date);
    }


    function formatDay(date) {
      return new Intl.DateTimeFormat(
        undefined,
        {
          day: "numeric"
        }
      ).format(date);
    }


    function formatWeekday(date) {
      return new Intl.DateTimeFormat(
        undefined,
        {
          weekday: "short"
        }
      ).format(date);
    }


    function formatTime(date) {
      return new Intl.DateTimeFormat(
        undefined,
        {
          hour: "numeric",
          minute: "2-digit"
        }
      ).format(date);
    }


    function escapeHTML(value = "") {
      const div =
        document.createElement("div");

      div.textContent =
        value;

      return div.innerHTML;
    }


    function icsDate(value) {
      return new Date(value)
        .toISOString()
        .replace(/[-:]/g, "")
        .replace(/\.\d{3}/, "");
    }


    function cleanICS(value = "") {
      return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/\n/g, "\\n")
        .replace(/,/g, "\\,")
        .replace(/;/g, "\\;");
    }


    function makeSingleEventICS(event) {
      const lines = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//FUSAB//Events//EN",
        "CALSCALE:GREGORIAN",
        "BEGIN:VEVENT",
        "DTSTAMP:" + icsDate(new Date()),
        "DTSTART:" + icsDate(event.start),
        "DTEND:" + icsDate(event.end),
        "SUMMARY:" + cleanICS(event.title),

        event.location
          ? "LOCATION:" + cleanICS(event.location)
          : "",

        event.description
          ? "DESCRIPTION:" + cleanICS(event.description)
          : "",

        "END:VEVENT",
        "END:VCALENDAR"
      ].filter(Boolean);

      const blob =
        new Blob(
          [lines.join("\r\n")],
          {
            type: "text/calendar;charset=utf-8"
          }
        );

      return URL.createObjectURL(blob);
    }


    function createEvent(event) {
      const start =
        new Date(event.start);

      const end =
        new Date(event.end);

      const article =
        document.createElement("article");

      article.className =
        "event";

      const timeText =
        event.allDay
          ? "All day"
          : `${formatTime(start)} – ${formatTime(end)}`;

      article.innerHTML = `
        <div class="date">

          <span class="day">
            ${formatDay(start)}
          </span>

          <span class="weekday">
            ${formatWeekday(start)}
          </span>

        </div>

        <div>

          <h2>
            ${escapeHTML(event.title)}
          </h2>

          <p class="meta">

            <span>
              ${escapeHTML(timeText)}
            </span>

            ${
              event.location
                ? `
                  <span>
                    ${escapeHTML(event.location)}
                  </span>
                `
                : ""
            }

          </p>

          ${
            event.description
              ? `
                <p class="description">
                  ${escapeHTML(event.description)}
                </p>
              `
              : ""
          }

        </div>
      `;

      const add =
        document.createElement("a");

      add.className =
        "add";

      add.textContent =
        "Add this event";

      add.href =
        makeSingleEventICS(event);

      add.download =
        `${(event.title || "event")
          .replace(/[\\/:*?"<>|]/g, "-")}.ics`;

      add.setAttribute(
        "aria-label",
        `Download ${event.title} as a calendar event`
      );

      article.appendChild(add);

      return article;
    }


    function renderEvents(events) {
      status.style.display =
        "none";

      if (!Array.isArray(events)) {
        status.style.display =
          "block";

        status.textContent =
          "The calendar returned an unexpected response.";

        return;
      }

      if (!events.length) {
        eventsContainer.innerHTML =
          `
            <div class="empty">
              No upcoming events.
            </div>
          `;

        return;
      }

      events.sort(
        (a, b) =>
          new Date(a.start) -
          new Date(b.start)
      );

      let currentMonth =
        "";

      let currentSection =
        null;

      events.forEach(event => {
        const date =
          new Date(event.start);

        const month =
          formatMonth(date);

        if (month !== currentMonth) {
          currentMonth =
            month;

          currentSection =
            document.createElement("section");

          currentSection.className =
            "month";

          const title =
            document.createElement("h2");

          title.className =
            "month-title";

          title.textContent =
            month;

          currentSection.appendChild(
            title
          );

          eventsContainer.appendChild(
            currentSection
          );
        }

        currentSection.appendChild(
          createEvent(event)
        );
      });
    }


    fetch(
      SCRIPT_URL + "?action=events"
    )

      .then(response => {
        if (!response.ok) {
          throw new Error(
            "Calendar request failed."
          );
        }

        return response.json();
      })

      .then(data => {
        if (
          data &&
          data.error
        ) {
          throw new Error(
            data.error
          );
        }

        renderEvents(data);
      })

      .catch(error => {
        console.error(error);

        status.textContent =
          "Events are temporarily unavailable. Please check back soon.";
      });

  </script>

</body>
</html>
